<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FBF0E1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Todo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Todo</title>
<style>
:root{
  --bg:#FBF0E1; --card:#FFF8EE; --sand:#F6E3C8; --terracotta:#C8502B; --navy:#2F4B73;
  --olive:#7A8B50; --mauve:#C9A6A9; --maroon:#7E4A4C; --mustard:#E8B35E; --ochre:#B27A1F;
  --lightOrange:#F4A259; --brown:#3B2A22;
  --rounded: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, -apple-system, sans-serif;
  --serif: ui-serif, "New York", "Hiragino Mincho ProN", Georgia, "Times New Roman", serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--brown);font-family:var(--rounded);-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
.page{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(106px + env(safe-area-inset-bottom));
  padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));
  display:flex;flex-direction:column;gap:14px;min-height:100dvh}
.press{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.press:active{transform:scale(.88)}

/* バナー */
.banner{position:relative;height:215px;background:var(--sand);border-radius:28px;overflow:hidden;flex:none}
.banner svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.leftdate{position:absolute;top:10px;left:18px;display:flex;flex-direction:column;gap:3px;color:var(--brown)}
.leftdate .y{font:700 34px/1.15 var(--serif)}
.leftdate .md{font:700 22px/1.15 var(--serif)}
.leftdate .wd{display:flex;align-items:center;gap:6px;font:600 13px var(--rounded);color:rgba(59,42,34,.75)}
.leftdate .wd i{display:block;width:12px;height:1.5px;background:var(--terracotta)}
.suntodo{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--card);pointer-events:none}
.suntodo svg{position:static;width:13px;height:13px}
.suntodo b{font:italic 700 32px/1.2 var(--serif)}
.suntodo i{display:block;width:34px;height:1.5px;background:var(--card)}

/* 件数の行 */
.summary{display:flex;align-items:center;gap:10px;padding:0 4px}
.summary .count{font:700 15px var(--rounded);flex:1}
.today-btn{font:700 12px var(--rounded);color:var(--card);background:var(--terracotta);padding:8px 12px;border-radius:999px}
.arrow{width:46px;height:46px;border-radius:50%;background:var(--navy);color:var(--card);display:grid;place-items:center;position:relative;box-shadow:0 3px 5px rgba(47,75,115,.3)}
.arrow::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px solid rgba(255,248,238,.35)}
.arrow svg{width:18px;height:18px}

/* めくる部分 */
.day{display:flex;flex-direction:column;gap:14px}
.day.in-next{animation:inNext .28s ease-in-out}
.day.in-prev{animation:inPrev .28s ease-in-out}
@keyframes inNext{from{transform:translateX(-60%);opacity:0}to{transform:none;opacity:1}}
@keyframes inPrev{from{transform:translateX(60%);opacity:0}to{transform:none;opacity:1}}
.progress{height:5px;margin:0 4px;background:rgba(122,139,80,.25);border-radius:999px;overflow:hidden}
.progress div{height:100%;background:var(--olive);border-radius:999px;transition:width .35s ease-out}

.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:30px;text-align:center}
.empty .e{font-size:48px;line-height:1.2}
.empty p{margin:0;font-size:17px;white-space:pre-line;color:rgba(59,42,34,.5);line-height:1.4}

/* カード */
.card{display:flex;align-items:center;gap:14px;padding:16px;background:var(--card);border-radius:22px;box-shadow:0 3px 6px rgba(59,42,34,.08)}
.cb{flex:none;width:44px;height:44px;display:grid;place-items:center}
.cb span{width:32px;height:32px;border-radius:9px;border:2.5px solid var(--mauve);background:var(--card);display:grid;place-items:center;transition:background .3s,border-color .3s}
.cb span svg{width:17px;height:17px;opacity:0;transform:scale(.4);transition:all .3s cubic-bezier(.3,1.6,.5,1)}
.cb.done span{background:var(--olive);border-color:var(--olive)}
.cb.done span svg{opacity:1;transform:none}
.body{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.title{font:500 17px/1.3 var(--rounded);word-break:break-word}
.card.done .title{text-decoration:line-through;color:rgba(59,42,34,.4)}
.chip{font:700 12px var(--rounded);padding:3px 8px;border-radius:999px;position:relative;overflow:hidden;color:var(--c)}
.chip::before{content:"";position:absolute;inset:0;background:var(--c);opacity:.15}
.chip span{position:relative}
.more{flex:none;width:36px;height:36px;display:grid;place-items:center;color:rgba(59,42,34,.5)}
.more svg{width:20px;height:20px}

/* 完了マーク */
.stamp{flex:none;position:relative;width:44px;height:44px}
.stamp svg{position:absolute;left:50%;top:50%;color:var(--lightOrange)}
.stamp .m{color:var(--mustard)}
.stamp .big{width:24px;height:24px;margin:-12px 0 0 -12px;transform:translate(-4px,3px)}
.stamp .s2{width:14px;height:14px;margin:-7px 0 0 -7px;transform:translate(13px,-12px)}
.stamp .s3{width:10px;height:10px;margin:-5px 0 0 -5px;transform:translate(12px,14px)}
.stamp .s4{width:8px;height:8px;margin:-4px 0 0 -4px;transform:translate(-16px,-14px)}
.stamp.anim .st{animation:pop .75s cubic-bezier(.3,1.7,.5,1) backwards;animation-delay:var(--d)}
@keyframes pop{from{scale:0;rotate:-120deg}to{scale:1;rotate:0deg}}
.stamp .sp{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;opacity:0}
.stamp.anim .sp{animation:burst .7s ease-out}
@keyframes burst{from{opacity:1;transform:scale(.3)}to{opacity:0;transform:translate(var(--x),var(--y)) scale(1)}}

/* 追加ボタン */
.fab{position:fixed;right:max(20px,calc(env(safe-area-inset-right) + 20px));bottom:calc(20px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;background:var(--navy);color:var(--card);display:grid;place-items:center;box-shadow:0 4px 8px rgba(47,75,115,.4);z-index:5}
@media (min-width:600px){.fab{right:calc(50% - 280px + 4px)}}
.fab svg{width:26px;height:26px}

/* メニュー */
.menu{position:fixed;z-index:30;min-width:160px;background:rgba(255,248,238,.97);border-radius:14px;box-shadow:0 8px 30px rgba(59,42,34,.25);padding:4px;display:none}
.menu.show{display:block}
.menu button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;font:400 17px var(--rounded);border-radius:10px;text-align:left}
.menu button:active{background:rgba(59,42,34,.08)}
.menu button.del{color:#d0342c}
.menu svg{width:18px;height:18px}
.backdrop{position:fixed;inset:0;z-index:20;display:none}
.backdrop.show{display:block}

/* 追加・編集シート */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--bg);border-radius:28px 28px 0 0;padding:0 0 calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.sheet.show{transform:none}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 18px 6px}
.nav h2{margin:0;font:600 17px var(--rounded)}
.nav .cancel{justify-self:start;color:var(--terracotta);font-size:17px}
.nav .save{justify-self:end;color:var(--terracotta);font-weight:700;font-size:17px}
.nav .save:disabled{opacity:.35}
.group{margin:14px 16px 0}
.group h3{margin:0 0 6px 16px;font:400 13px var(--rounded);color:rgba(59,42,34,.55)}
.row{background:var(--card);border-radius:14px;padding:0 16px;min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.row input[type=text]{width:100%;border:0;background:none;outline:0;font:400 17px var(--rounded);color:var(--brown);padding:12px 0}
.row input[type=text]::placeholder{color:rgba(59,42,34,.35)}
.row label{font:400 17px var(--rounded)}
.row input[type=date]{font:400 17px var(--rounded);color:var(--terracotta);background:rgba(200,80,43,.12);border:0;border-radius:9px;padding:6px 10px;min-height:34px;accent-color:var(--terracotta)}
</style>
</head>
<body>
<div class="page" id="page"></div>
<button class="fab press" id="fab" aria-label="追加">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>
</button>

<div class="backdrop" id="backdrop"></div>
<div class="menu" id="menu">
  <button id="m-edit">編集
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16.5 4.5a2 2 0 013 3L8 19z"/></svg>
  </button>
  <button id="m-del" class="del">削除
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
  </button>
</div>

<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="nav">
    <button class="cancel" id="cancel">キャンセル</button>
    <h2 id="sheet-title">新しいTodo</h2>
    <button class="save" id="save">保存</button>
  </div>
  <div class="group">
    <h3>やること</h3>
    <div class="row"><input type="text" id="f-title" placeholder="Todoを入力" enterkeyhint="done" autocomplete="off"></div>
  </div>
  <div class="group">
    <h3>期限</h3>
    <div class="row"><label for="f-date">期限日</label><input type="date" id="f-date" lang="ja"></div>
  </div>
</div>

<script>
"use strict";
/* ===== 色 ===== */
const C = {background:"#FBF0E1",card:"#FFF8EE",sand:"#F6E3C8",terracotta:"#C8502B",navy:"#2F4B73",olive:"#7A8B50",
  mauve:"#C9A6A9",maroon:"#7E4A4C",mustard:"#E8B35E",ochre:"#B27A1F",lightOrange:"#F4A259",brown:"#3B2A22"};

/* ===== 日付の道具(すべて端末の時間・日付だけの文字列 YYYY-MM-DD で扱う) ===== */
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a,b) => Math.round((Date.UTC(...b.split("-").map((v,i)=>i==1?v-1:+v)) - Date.UTC(...a.split("-").map((v,i)=>i==1?v-1:+v)))/86400000);
const WD = ["日","月","火","水","木","金","土"];

/* ===== 保存 ===== */
const KEY = "savedTasks";
let todos = [];
function load(){ try{ const v = JSON.parse(localStorage.getItem(KEY)||"[]"); if(Array.isArray(v)) todos = v; }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(todos)); }catch(e){} }
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(16).slice(2));

/* ===== 状態 ===== */
let today = ymd(new Date());
let selectedDay = today;
let goingNext = true;
let justCompletedID = null;
let editingId = null;
let animateDay = false;

function visibleTodos(){
  const list = todos.filter(t => t.isDone ? (t.doneDate === selectedDay) : (selectedDay >= today));
  return list.map((t,i)=>[t,i]).sort((a,b)=>{
    const [x,y] = [a[0],b[0]];
    if(!!x.isDone !== !!y.isDone) return x.isDone ? 1 : -1;
    if(x.dueDate !== y.dueDate) return x.dueDate < y.dueDate ? -1 : 1;
    return a[1]-b[1];
  }).map(p=>p[0]);
}

/* ===== 図形 ===== */
const SPARKLE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C12.6 6.6 17.4 11.4 24 12 17.4 12.6 12.6 17.4 12 24 11.4 17.4 6.6 12.6 0 12 6.6 11.4 11.4 6.6 12 0Z"/></svg>';
const sparkle = (cls,style="") => SPARKLE.replace("<svg",`<svg class="${cls}" style="${style}"`);

// 丘の形(なめらかな波の上のふち + その下を塗りつぶす)
function edgeSlope(h0,h1,m0,m1){
  let s = ((2*h0+h1)*m0 - h0*m1)/(h0+h1);
  if(s*m0 <= 0) s = 0;
  else if(m0*m1 <= 0 && Math.abs(s) > 3*Math.abs(m0)) s = 3*m0;
  return s;
}
function hillPath(pts,w,h){
  const n = pts.length; if(n < 3) return "";
  const xs = pts.map(p=>p[0]*w), ys = pts.map(p=>p[1]*h);
  const gaps=[], slopes=[];
  for(let i=0;i<n-1;i++){ const dx = xs[i+1]-xs[i]; gaps.push(dx); slopes.push((ys[i+1]-ys[i])/dx); }
  const d = new Array(n).fill(0);
  for(let i=1;i<n-1;i++){
    if(slopes[i-1]*slopes[i] > 0){
      const w1 = 2*gaps[i]+gaps[i-1], w2 = gaps[i]+2*gaps[i-1];
      d[i] = (w1+w2)/(w1/slopes[i-1] + w2/slopes[i]);
    }
  }
  d[0] = edgeSlope(gaps[0],gaps[1],slopes[0],slopes[1]);
  d[n-1] = edgeSlope(gaps[n-2],gaps[n-3],slopes[n-2],slopes[n-3]);
  let p = `M${xs[0]} ${ys[0]}`;
  for(let i=0;i<n-1;i++){
    const dx = gaps[i];
    p += `C${xs[i]+dx/3} ${ys[i]+d[i]*dx/3} ${xs[i+1]-dx/3} ${ys[i+1]-d[i+1]*dx/3} ${xs[i+1]} ${ys[i+1]}`;
  }
  return p + `L${xs[n-1]} ${h+20}L${xs[0]} ${h+20}Z`;
}
// 松の木
function treePath(cxr,baseR,hr,wr,w,h){
  const cx = cxr*w, base = baseR*h, th = hr*h, tw = wr*w, top = base-th;
  const steps = [[0,0],[.34,.36],[.22,.36],[.46,.70],[.32,.70],[.55,1]];
  const L=[],R=[];
  for(const [sx,sy] of steps){ const y = top+sy*th; L.push([cx-sx*tw,y]); R.push([cx+sx*tw,y]); }
  const th2 = .07*tw, tb = base+.03*h;
  L.push([cx-th2,base],[cx-th2,tb]); R.push([cx+th2,base],[cx+th2,tb]);
  const pts = [...L,...R.reverse()];
  return "M"+pts.map(p=>p.join(" ")).join("L")+"Z";
}
function bannerSVG(w,h=215){
  const hill = (pts,col)=>`<path d="${hillPath(pts,w,h)}" fill="${col}"/>`;
  const tree = (a,b,c,d)=>`<path d="${treePath(a,b,c,d,w,h)}" fill="${C.card}"/>`;
  const r = h*.62/2;
  return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <circle cx="${w*.73}" cy="${h*.40}" r="${r}" fill="${C.terracotta}"/>
    ${hill([[0,.40],[.10,.31],[.26,.26],[.40,.36],[.52,.52],[.66,.62],[.82,.60],[1,.54]],C.card)}
    ${hill([[0,.55],[.12,.48],[.28,.44],[.44,.55],[.58,.68],[.72,.68],[.86,.64],[1,.60]],C.navy)}
    ${hill([[0,.70],[.16,.62],[.34,.64],[.52,.76],[.68,.84],[.85,.84],[1,.80]],C.card)}
    ${hill([[0,.73],[.16,.66],[.34,.68],[.52,.79],[.68,.87],[.85,.87],[1,.83]],C.mauve)}
    ${hill([[0,.89],[.20,.82],[.40,.86],[.58,.96],[.66,1.02]],C.card)}
    ${hill([[0,.92],[.20,.86],[.40,.90],[.58,.99],[.66,1.05]],C.maroon)}
    ${hill([[.40,1.04],[.56,.94],[.76,.90],[1,.94]],C.olive)}
    ${tree(.91,.93,.42,.15)}
    ${tree(.81,.95,.24,.10)}
  </svg>`;
}

const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#FFF8EE" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 6.5"/></svg>';
const CHEV_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg>';
const CHEV_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l8 8-8 8"/></svg>';
const DOTS = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="4" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="20" cy="12" r="2"/></svg>';

function stampHTML(animated){
  let s = `<div class="stamp${animated?" anim":""}">`;
  for(let i=0;i<8;i++){
    const a = i/8*2*Math.PI;
    s += sparkle("sp"+(i%2?" m":""),`--x:${(Math.cos(a)*30).toFixed(1)}px;--y:${(Math.sin(a)*30).toFixed(1)}px`);
  }
  s += sparkle("st big","--d:0s") + sparkle("st s2 m","--d:.08s") + sparkle("st s3","--d:.16s") + sparkle("st s4 m","--d:.24s");
  return s + "</div>";
}

/* ===== 期限の表示 ===== */
function dueInfo(t){
  if(t.isDone) return ["完了",C.olive];
  const days = diffDays(selectedDay,t.dueDate);
  if(days < 0) return [`期限切れ・${-days}日経過`,C.terracotta];
  if(days === 0) return ["今日まで",C.ochre];
  if(days === 1) return ["明日まで",C.navy];
  const d = parse(t.dueDate);
  return [`あと${days}日(${d.getMonth()+1}/${d.getDate()}まで)`,C.navy];
}
const esc = s => s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ===== 描画 ===== */
const page = document.getElementById("page");
function render(){
  const list = visibleTodos();
  const total = list.length, done = list.filter(t=>t.isDone).length;
  const sd = parse(selectedDay);
  const viewingToday = selectedDay === today;
  const w = Math.max(200, Math.min(page.clientWidth,560) - 32);

  let empty = "";
  if(selectedDay < today) empty = "この日に完了したTodoは\nありません";
  else if(viewingToday) empty = "今日のTodoはありません\n右下の＋ボタンで追加しましょう";
  else empty = "この日のTodoはありません\n右下の＋ボタンで追加しましょう";

  let inner = "";
  if(total === 0){
    inner = `<div class="empty"><div class="e">🌿</div><p>${empty}</p></div>`;
  }else{
    inner = `<div class="progress"><div style="width:${total?done/total*100:0}%"></div></div>`;
    for(const t of list){
      const [txt,col] = dueInfo(t);
      inner += `<div class="card${t.isDone?" done":""}" data-id="${t.id}">
        <button class="cb${t.isDone?" done":""}" data-act="toggle" aria-label="完了"><span>${CHECK}</span></button>
        <div class="body"><div class="title">${esc(t.title)}</div><div class="chip" style="--c:${col}"><span>${txt}</span></div></div>
        ${t.isDone ? stampHTML(justCompletedID === t.id) : ""}
        <button class="more" data-act="more" aria-label="メニュー">${DOTS}</button>
      </div>`;
    }
  }

  page.innerHTML = `
    <div class="banner" id="banner">${bannerSVG(w)}
      <div class="suntodo" style="left:${w*.73}px;top:${215*.35}px">${SPARKLE}<b>Todo</b><i></i></div>
      <div class="leftdate"><div class="y">${sd.getFullYear()}</div><div class="md">${sd.getMonth()+1}月${sd.getDate()}日</div>
        <div class="wd"><i></i>${WD[sd.getDay()]}曜日</div></div>
    </div>
    <div class="summary">
      <div class="count">${total===0?"Todoなし":`${total}件中 ${done}件完了`}</div>
      ${viewingToday?"":'<button class="today-btn press" data-act="today">今日に戻る</button>'}
      <button class="arrow press" data-act="prev" aria-label="前の日">${CHEV_L}</button>
      <button class="arrow press" data-act="next" aria-label="次の日">${CHEV_R}</button>
    </div>
    <div class="day${animateDay?(goingNext?" in-next":" in-prev"):""}">${inner}</div>`;
  animateDay = false;
}

/* ===== 操作 ===== */
function buzz(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }
function goTo(day){
  goingNext = day > selectedDay;
  selectedDay = day;
  animateDay = true;
  buzz(8);
  render();
}
const moveDay = n => goTo(addDays(selectedDay,n));

function refreshToday(){
  const nt = ymd(new Date());
  if(nt === today) return;
  if(selectedDay === today) selectedDay = nt;
  today = nt;
  render();
}

function toggle(id){
  const t = todos.find(x=>x.id===id); if(!t) return;
  t.isDone = !t.isDone;
  if(t.isDone){
    t.doneDate = selectedDay;
    justCompletedID = id;
    setTimeout(()=>{ if(justCompletedID===id) justCompletedID = null; },1500);
    buzz([10,40,20]);
  }else{
    t.doneDate = null; buzz(8);
  }
  save(); render();
}
function del(id){ todos = todos.filter(x=>x.id!==id); save(); render(); }

/* ===== メニュー ===== */
const menu = document.getElementById("menu"), backdrop = document.getElementById("backdrop");
let menuId = null;
function openMenu(id,btn){
  menuId = id;
  const r = btn.getBoundingClientRect();
  menu.classList.add("show"); backdrop.classList.add("show");
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let left = Math.min(Math.max(8, r.right - mw), innerWidth - mw - 8);
  let top = r.bottom + 4; if(top + mh > innerHeight - 8) top = r.top - mh - 4;
  menu.style.left = left+"px"; menu.style.top = top+"px";
}
function closeMenu(){ menu.classList.remove("show"); backdrop.classList.remove("show"); }
backdrop.addEventListener("click",closeMenu);
document.getElementById("m-edit").addEventListener("click",()=>{ const id = menuId; closeMenu(); openEditor(id); });
document.getElementById("m-del").addEventListener("click",()=>{ const id = menuId; closeMenu(); del(id); });

/* ===== 追加・編集シート ===== */
const sheet = document.getElementById("sheet"), sheetBg = document.getElementById("sheet-bg");
const fTitle = document.getElementById("f-title"), fDate = document.getElementById("f-date"), saveBtn = document.getElementById("save");
function updateSave(){ saveBtn.disabled = fTitle.value.trim() === ""; }
function openEditor(id){
  editingId = id || null;
  const t = id ? todos.find(x=>x.id===id) : null;
  document.getElementById("sheet-title").textContent = t ? "Todoを編集" : "新しいTodo";
  fTitle.value = t ? t.title : "";
  fDate.value = t ? t.dueDate : (selectedDay > today ? selectedDay : today);
  updateSave();
  sheet.classList.add("show"); sheetBg.classList.add("show");
  setTimeout(()=>fTitle.focus(),250);
}
function closeEditor(){ sheet.classList.remove("show"); sheetBg.classList.remove("show"); fTitle.blur(); }
function commit(){
  const title = fTitle.value.trim(); if(!title) return;
  const due = fDate.value || today;
  const t = editingId ? todos.find(x=>x.id===editingId) : null;
  if(t){ t.title = title; t.dueDate = due; }
  else todos.push({id:uid(),title,dueDate:due,isDone:false,doneDate:null});
  editingId = null; save(); closeEditor(); render();
}
fTitle.addEventListener("input",updateSave);
fTitle.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); commit(); } });
saveBtn.addEventListener("click",commit);
document.getElementById("cancel").addEventListener("click",closeEditor);
sheetBg.addEventListener("click",closeEditor);
document.getElementById("fab").addEventListener("click",()=>openEditor(null));

/* ===== タップ・スワイプ ===== */
page.addEventListener("click",e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act, card = b.closest(".card");
  if(act==="toggle") toggle(card.dataset.id);
  else if(act==="more") openMenu(card.dataset.id,b);
  else if(act==="prev") moveDay(-1);
  else if(act==="next") moveDay(1);
  else if(act==="today") goTo(today);
});
// 右にスライド → 次の日 / 左にスライド → 前の日(元のアプリと同じ向き)
let sx=0, sy=0, tracking=false;
document.addEventListener("touchstart",e=>{
  if(e.touches.length!==1 || sheet.classList.contains("show")){ tracking=false; return; }
  tracking=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY;
},{passive:true});
document.addEventListener("touchend",e=>{
  if(!tracking) return; tracking=false;
  const t = e.changedTouches[0], dx = t.clientX-sx, dy = t.clientY-sy;
  if(Math.hypot(dx,dy) < 20) return;
  if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)*1.2) moveDay(dx>0?1:-1);
},{passive:true});
document.addEventListener("keydown",e=>{
  if(sheet.classList.contains("show")){ if(e.key==="Escape") closeEditor(); return; }
  if(e.key==="ArrowLeft") moveDay(-1);
  if(e.key==="ArrowRight") moveDay(1);
});

/* 日をまたいだ・アプリに戻ってきたとき「今日」を更新 */
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refreshToday(); });
window.addEventListener("focus",refreshToday);
setInterval(refreshToday,60000);
let rt; window.addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(render,120); });

load(); render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
